# WorkGremlin desktop packaging config (M3)
# Usage: first `npm run build` to produce renderer/dist, then `npx electron-builder --linux AppImage --x64`
# Note: the arch is passed via the CLI's --x64; it is not hardcoded here (docs require it to be parameterized).

appId: com.workgremlin.app
productName: WorkGremlin
copyright: Copyright © 2026 WorkGremlin

directories:
  output: dist
  # Packaging resources (icons etc.) go here; can be left empty, but the dir must exist
  buildResources: build

# Main-process entry (electron-builder reads package.json's main field)
# desktop/src/launcher.js: after packaging, uses Electron's bundled Node to start the server and reuse main.js's client logic

files:
  - package.json
  - desktop
  - server
  - shared
  - packages
  - renderer/dist
  - scripts
  - node_modules

# Native modules must be unpacked out of asar, otherwise they cannot be dlopen'd inside asar (better-sqlite3's .node)
# Unpacking the whole server dir is simpler: it reads cli.js / config and writes the db under HOME
asarUnpack:
  - "server/**"
  - "**/better-sqlite3/**/*.node"

linux:
  target:
    - AppImage
  category: Utility
  # executableName defaults to productName lowercased; specify here to customize

# Size optimization (optional; enable after it builds):
# Use .electron-builderignore to exclude dev dependencies in node_modules (vite / esbuild / @electron/rebuild …)
