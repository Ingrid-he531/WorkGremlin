name: Client packages (Windows)

# Builds the client-only package (electron-builder.client.yml): the window as a thin client for a
# WorkGremlin server running elsewhere. There is no server and no native module in this package, so
# the build needs no SQLite/C++ toolchain and no Wine.
#
# Runs manually (Actions -> Run workflow), on pushes to main that touch the client, and on v* tags.
# Artifacts: workgremlin-client-<version>-x64.zip (unpacked app)
#            workgremlin-client-<version>-x64.exe (portable single file)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "package.json"
      - "package-lock.json"
      - "electron-builder.client.yml"
      - "desktop/**"
      - "renderer/**"
      - "shared/**"
      - ".github/workflows/client-windows.yml"
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: client-windows-${{ github.ref }}
  cancel-in-progress: true

env:
  # Electron is downloaded by electron-builder during packaging, not by the `electron` npm package
  # during `npm ci`; skipping the latter keeps the install step free of a 120 MB download and of a
  # binary that this package never ships.
  ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
  # The repo's .npmrc points electron_mirror at npmmirror (fast in China, unreliable on GitHub
  # runners). npm_config_* wins over ELECTRON_MIRROR in @electron/get, so set both.
  ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/
  npm_config_electron_mirror: https://github.com/electron/electron/releases/download/

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # Electron and electron-builder caches; otherwise every run re-downloads ~120 MB.
      - name: Cache Electron downloads
        uses: actions/cache@v6
        with:
          path: |
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-

      - name: Environment info
        run: |
          node -v
          npm -v
          npm config get registry
          npm config get electron_mirror

      # --ignore-scripts: the client package contains no server and no native module, so neither the
      # electron binary (see ELECTRON_SKIP_BINARY_DOWNLOAD above) nor the electron-rebuild of
      # better-sqlite3 is needed. Both were the expensive, toolchain-sensitive parts of the install.
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build renderer
        run: npm run build

      - name: Package client (zip + portable exe)
        run: npx electron-builder --config electron-builder.client.yml --win zip portable --x64
        env:
          # Unsigned build: do not try to discover a signing certificate.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: List artifacts
        shell: pwsh
        run: Get-ChildItem dist-client -File | Select-Object Name, Length | Format-Table

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: workgremlin-client-windows-x64
          path: |
            dist-client/*.zip
            dist-client/*.exe
          if-no-files-found: error
          retention-days: 30
