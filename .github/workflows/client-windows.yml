name: Client packages (Windows)

# Builds the client-only package (electron-builder.client.yml): the window as a thin client for a
# WorkGremlin server running elsewhere. There is no server and no native module in this package, so
# no SQLite toolchain and no Wine are needed.
#
# Run it manually from the Actions tab ("Run workflow"), or push a `v*` tag.
# Artifacts: workgremlin-client-<version>-x64.zip (unpacked app) and
#            workgremlin-client-<version>-x64.exe (portable single file).

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: client-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Electron and electron-builder caches: the runner re-downloads ~120 MB of Electron otherwise.
      - name: Cache Electron downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-

      # WORKGREMLIN_SKIP_REBUILD: the client package must not contain better-sqlite3, so the
      # electron-rebuild postinstall step is pointless here and would only require a C++ toolchain.
      # ELECTRON_MIRROR: override the npmmirror listed in .npmrc (fast in China, unreliable from
      # GitHub's runners) with the official GitHub release URL.
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
        env:
          WORKGREMLIN_SKIP_REBUILD: "1"
          ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/
          npm_config_electron_mirror: https://github.com/electron/electron/releases/download/

      - name: Build renderer
        run: npm run build

      - name: Package client (zip + portable exe)
        run: npx electron-builder --config electron-builder.client.yml --win zip portable --x64
        env:
          # Unsigned build: do not try to discover a signing certificate.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: List artifacts
        shell: pwsh
        run: Get-ChildItem dist-client -File | Select-Object Name, Length | Format-Table

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: workgremlin-client-windows-x64
          path: |
            dist-client/*.zip
            dist-client/*.exe
          if-no-files-found: error
          retention-days: 30
